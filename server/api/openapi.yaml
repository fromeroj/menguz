openapi: 3.0.3
info:
  title: Menguz API
  description: |
    API HTTP de la plataforma **Menguz Vinos & Licores**: tienda en línea (B2C),
    portal mayorista (B2B), panel de administración (JWT), chatbot, sommelier IA
    (SSE) y webhooks de WhatsApp Business (Meta).

    La documentación interactiva Swagger UI se sirve embebida en el propio binario
    en `/docs` y la especificación en `/openapi.yaml`.

    - **Autenticación admin:** `POST /api/auth/login` con correo/contraseña del
      administrador; devuelve `access_token` (JWT HS256, 15 min por defecto) y
      `refresh_token` rotativo de un solo uso (7 días). Envia el access token como
      `Authorization: Bearer <token>` en el grupo `/api/admin/*` (roles `admin` y
      `ventas`).
    - **Autenticación B2B:** `POST /api/b2b/login` con el correo del cliente SAE y
      la contraseña del portal; el token (rol `b2b`) habilita `/api/b2b/*` y precia
      el catálogo con la lista de precios SAE del cliente (1 = menudeo, 2 = medio
      mayorista, 3 = vinatería).
    - **Carrito:** se identifica por la cookie HttpOnly `mgz_cart` (7 días); el
      servidor la crea automáticamente en la primera llamada.
    - **Errores:** las respuestas de error usan el formato `{"message": "..."}`
      (estándar de Echo), con los códigos documentados por operación.
    - **Rate limiting:** límite global por IP en `/api/*`, `/admin/*`, `/data/*`
      y `/webhooks/*`; buckets más estrictos en checkout y chat (429).
    - **Panel HTML:** además de esta API JSON existe un panel de administración
      renderizado en servidor (sesión por cookie) bajo `/admin` — fuera del
      alcance de esta especificación, que cubre exclusivamente la API JSON.
  version: 0.4.0
  contact:
    name: Darkvoice Center
    url: https://darkvoice.center/
  x-admin-panel:
    tag: admin-panel
    description: Panel de administración HTML (sesión por cookie) disponible en /admin — no forma parte de esta especificación JSON.
servers:
  - url: http://localhost:8080
    description: Desarrollo local
  - url: https://api.menguz.mx
    description: Producción (placeholder — ajustar al dominio real)
tags:
  - name: Salud
    description: Estado del servicio y metadatos.
  - name: Catálogo
    description: Productos, categorías y fichas de sommelier públicas (sincronizados desde Aspel SAE 8.0).
  - name: Promociones
    description: Campañas promocionales vigentes publicadas en el storefront.
  - name: Carrito y Pedidos
    description: Carrito por cookie, checkout con referencia de transferencia bancaria y rastreo de pedidos.
  - name: Chatbot
    description: Chatbot de atención al cliente con respuesta en streaming (SSE).
  - name: Sommelier
    description: Asesor de vinos IA (DeepSeek + inventario en vivo) con recomendaciones en streaming (SSE).
  - name: Autenticación
    description: Login/refresh/logout de administradores y acceso al portal B2B; emite JWT Bearer.
  - name: Admin
    description: 'API de administración protegida con JWT (roles `admin` | `ventas`): pedidos, campañas, clientes, sync, chat, CRM y fichas de producto.'
  - name: B2B
    description: 'API del portal mayorista protegida con JWT (rol `b2b`): perfil, catálogo con lista de precios SAE y pedidos.'
  - name: Webhooks
    description: 'Webhook de WhatsApp Business API (Meta): verificación y recepción de mensajes.'
paths:
  /healthz:
    get:
      tags: [Salud]
      summary: Estado del servicio
      description: Devuelve el estado del servicio, la versión del binario y la marca de la última sincronización SAE. Sin autenticación.
      operationId: healthz
      responses:
        '200':
          description: Servicio en operación.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  version: {type: string, example: 0.4.0}
                  last_sync: {type: string, example: '2024-05-01T03:00:05Z'}
                  time: {type: string, format: date-time, example: '2024-05-02T12:34:56Z'}
  /data/products.json:
    get:
      tags: [Catálogo]
      summary: Productos ligeros para el storefront
      description: |
        Arreglo plano de productos activos en el formato compacto que consume la
        sección «Especiales» del storefront — claves cortas `n,p,c,g,i`
        (nombre, precio efectivo, categoría, grupo, imagen sin `/` inicial).
        Precio efectivo = `precio_oferta` cuando aplica, si no `precio_base`.
        Sin autenticación.
      operationId: dataProductsJSON
      responses:
        '200':
          description: Lista de productos activos, ordenada por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoPublicoLite'
              example:
                - {n: Malbec Reserva 2021, p: 489.0, c: Vino Tinto, g: Vinos, i: products/malbec-reserva.png}
                - {n: Tequila Añejo 750ml, p: 720.0, c: Tequila, g: Licores, i: products/teq-anejo.png}
  /api/products:
    get:
      tags: [Catálogo]
      summary: Listar productos con búsqueda y filtros
      description: |
        Lista paginada de productos activos con búsqueda por texto
        (nombre, descripción u origen) y filtros exactos de categoría y grupo.
        Sin autenticación.
      operationId: listProducts
      parameters:
        - name: q
          in: query
          description: Búsqueda libre (insensible a mayúsculas) sobre nombre, descripción y origen.
          schema: {type: string, example: malbec}
        - name: categoria
          in: query
          description: Filtro exacto de categoría (p. ej. `Vino Tinto`).
          schema: {type: string, example: Vino Tinto}
        - name: grupo
          in: query
          description: Filtro exacto de grupo (p. ej. `Vinos`, `Licores`).
          schema: {type: string, example: Vinos}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Página de productos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Producto'}}
                  total: {type: integer, example: 187}
                  page: {type: integer, example: 1}
                  per_page: {type: integer, example: 24}
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/products/{cve}:
    get:
      tags: [Catálogo]
      summary: Detalle de un producto
      description: Devuelve el producto completo junto con las campañas vigentes que lo referencian. Sin autenticación.
      operationId: getProduct
      parameters:
        - $ref: '#/components/parameters/CveArt'
      responses:
        '200':
          description: Producto con sus promociones vigentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  producto: {$ref: '#/components/schemas/Producto'}
                  promociones:
                    type: array
                    items: {$ref: '#/components/schemas/Campana'}
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/products/{cve}/perfil:
    get:
      tags: [Catálogo]
      summary: Ficha de sommelier pública de un producto
      description: |
        Ficha curada (capa editorial) que alimenta al Sommelier IA: uvas, bodega,
        región, notas de cata, maridaje, ocasiones y tags, más precio efectivo,
        existencia e imagen en vivo. Sin autenticación.
      operationId: publicPerfil
      parameters:
        - $ref: '#/components/parameters/CveArt'
      responses:
        '200':
          description: Ficha completa del vino/licor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaVino'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/categories:
    get:
      tags: [Catálogo]
      summary: Listar categorías con conteo
      description: Categorías de productos activos con el grupo al que pertenecen y el número de productos en cada una. Sin autenticación.
      operationId: listCategories
      responses:
        '200':
          description: Lista ordenada por nombre.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Categoria'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/promos:
    get:
      tags: [Promociones]
      summary: Promociones vigentes
      description: |
        Campañas activas dentro de su vigencia, ordenadas por `orden` e inicio.
        Si la campaña liga un producto, decora `precio_oferta` con el precio del
        catálogo. Sin autenticación.
      operationId: activePromos
      parameters:
        - name: tipo
          in: query
          description: Filtra por tipo de campaña.
          schema: {type: string, enum: [carousel, producto_mes, especial]}
      responses:
        '200':
          description: Campañas vigentes.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Campana'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/cart:
    get:
      tags: [Carrito y Pedidos]
      summary: Ver carrito
      description: |
        Devuelve las partidas del carrito enriquecidas con datos en vivo del
        catálogo (nombre, precio efectivo, existencia, importe) y el subtotal.
        Crea la cookie HttpOnly `mgz_cart` (7 días) si aún no existe.
        Sin autenticación.
      operationId: getCart
      responses:
        '200':
          description: Estado actual del carrito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CartLine'}
                  subtotal: {type: number, example: 1458.0}
                  count: {type: integer, example: 3}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/cart/items:
    post:
      tags: [Carrito y Pedidos]
      summary: Agregar partida al carrito
      description: |
        Suma la cantidad indicada a la partida del producto (o la crea).
        Rechaza productos inactivos/inexistentes y cantidades mayores a la
        existencia. Requiere la cookie `mgz_cart` (se crea si falta).
        Sin autenticación.
      operationId: cartAdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cve_art, cantidad]
              properties:
                cve_art: {type: string, example: VIN-TIN-001}
                cantidad: {type: number, example: 2, description: '1–500 (validate: gt=0, lte=500)'}
      responses:
        '200':
          description: Partida agregada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, example: true}
                  count: {type: integer, example: 3, description: Número de partidas distintas en el carrito.}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/cart/items/{cve}:
    delete:
      tags: [Carrito y Pedidos]
      summary: Quitar partida del carrito
      description: Elimina la partida con la clave indicada del carrito de la cookie. Sin autenticación.
      operationId: cartRemove
      parameters:
        - $ref: '#/components/parameters/CveArt'
      responses:
        '200':
          description: Partida eliminada (o el carrito no existía).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, example: true}
                  count: {type: integer, example: 2}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/checkout:
    post:
      tags: [Carrito y Pedidos]
      summary: Crear pedido B2C con referencia de transferencia
      description: |
        Convierte el carrito en una orden `b2c` con estado `pendiente_pago` y una
        referencia de transferencia única (`MENG######`). Reserva existencia,
        vacía el carrito y devuelve los datos bancarios para el pago. No hay
        pasarela de tarjetas: el flujo B2C es por transferencia bancaria.
        Protegido con rate limit estricto por IP.
      operationId: checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, email, telefono]
              properties:
                nombre: {type: string, minLength: 3, example: María Fernanda López}
                email: {type: string, format: email, example: maria@example.com}
                telefono: {type: string, minLength: 8, example: '5512345678'}
                direccion: {type: string, example: Av. Reforma 123, CDMX}
                notas: {type: string, example: Entregar después de las 6 pm}
                envio: {type: number, example: 150.0, description: Costo de envío agregado al subtotal.}
      responses:
        '201':
          description: Pedido creado en estado `pendiente_pago` con instrucciones de pago.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orden: {$ref: '#/components/schemas/Orden'}
                  pago: {$ref: '#/components/schemas/PagoTransferencia'}
        '400':
          description: JSON inválido, carrito vacío, producto agotado/inexistente o existencia insuficiente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                carritoVacio: {value: {message: el carrito está vacío}}
                sinExistencia: {value: {message: 'existencia insuficiente para Malbec Reserva 2021'}}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/orders/lookup:
    get:
      tags: [Carrito y Pedidos]
      summary: Rastrear pedido por folio y correo
      description: |
        Permite al cliente consultar el estado de su pedido con el folio
        (`MGZ-######`, recibido al hacer checkout) y el correo usado en la compra.
        Ambos parámetros son obligatorios. Sin autenticación.
      operationId: orderLookup
      parameters:
        - name: folio
          in: query
          required: true
          schema: {type: string, example: MGZ-000042}
        - name: email
          in: query
          required: true
          schema: {type: string, format: email, example: maria@example.com}
      responses:
        '200':
          description: Estado del pedido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  folio: {type: string, example: MGZ-000042}
                  estado: {$ref: '#/components/schemas/EstadoOrden'}
                  total: {type: number, example: 1608.0}
                  referencia_pago: {type: string, example: MENG000042}
                  created_at: {type: string, format: date-time}
                  items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        '400':
          description: Falta `folio` o `email`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: folio y email son requeridos}
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/chat:
    post:
      tags: [Chatbot]
      summary: Chatbot de atención al cliente (SSE)
      description: |
        Envía un mensaje del cliente y recibe la respuesta del chatbot como
        stream de eventos (`text/event-stream`). Usa OpenAI (GPT) con RAG sobre
        el catálogo cuando `OPENAI_API_KEY` está configurado; de lo contrario,
        un motor determinista con las mismas salvaguardas. La conversación se
        guarda con `canal=web` y es visible en la revisión de chat del admin.
        Rate limit propio por IP.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 2000, example: '¿Tienen Malbec de Valle de Guadalupe?'}
                session_id: {type: string, description: ID de sesión previo (evento `session`); se genera si se omite.}
      responses:
        '200':
          description: |
            Stream SSE. Eventos:
            - `session`: data = ID de sesión (reenvíalo como `session_id` en el siguiente mensaje).
            - `delta`: fragmentos de texto de la respuesta, en orden.
            - `done`: data = respuesta completa final.
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: session
                data: chat_a1b2c3d4e5f6a7b8

                event: delta
                data: ¡Claro!

                event: delta
                data: Tenemos tres Malbec de Valle de Guadalupe…

                event: done
                data: ¡Claro! Tenemos tres Malbec de Valle de Guadalupe…
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/sommelier/chat:
    post:
      tags: [Sommelier]
      summary: Sommelier IA con recomendaciones de producto (SSE)
      description: |
        Asesor de vinos estilo Hedonism: recibe el mensaje del usuario y
        responde en streaming, conectando con el inventario en vivo. Usa
        DeepSeek cuando `DEEPSEEK_API_KEY` está configurado; si no, un motor
        determinista. Además de la respuesta, emite un evento `products` con las
        tarjetas de los productos recomendados. La sesión se guarda con
        `canal=sommelier`. Rate limit propio por IP.
      operationId: sommelierChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 1, maxLength: 2000, example: '¿Qué vino me recomiendas para un asado con amigos?'}
                session_id: {type: string, description: ID de sesión previo (evento `session`); se genera si se omite.}
      responses:
        '200':
          description: |
            Stream SSE. Eventos:
            - `session`: data = ID de sesión.
            - `delta`: fragmentos de texto, en orden.
            - `products`: data = arreglo JSON de tarjetas de producto recomendado (solo si hubo recomendaciones).
            - `done`: data = respuesta completa final.
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                event: session
                data: somm_b2c3d4e5f6a7b8c9

                event: delta
                data: Para un asado te va a encantar…

                event: products
                data: [{"cve_art":"VIN-TIN-001","nombre":"Malbec Reserva 2021","precio":489.0,"existencia":12.0,"imagen":"products/malbec.png","categoria":"Vino Tinto","bodega":"Viñedos del Valle","uvas":["Malbec"],"anada":"2021","maridaje":"Carnes rojas a la parrilla"}]

                event: done
                data: Para un asado te va a encantar el Malbec Reserva…
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Login de administrador
      description: |
        Autentica un usuario del panel (roles `admin` | `ventas`) con correo y
        contraseña. Devuelve el par de tokens y además fija las cookies
        `mgz_token`, `mgz_refresh` y `csrf` para el panel HTML.
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, example: admin@menguz.local}
                password: {type: string, minLength: 6, example: s3cret0-muy-largo}
      responses:
        '200':
          description: Tokens emitidos.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: credenciales inválidas}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/refresh:
    post:
      tags: [Autenticación]
      summary: Rotar tokens (access + refresh)
      description: |
        Consume un refresh token (de un solo uso; el anterior queda invalidado) y
        devuelve un par nuevo. Acepta el token como campo de formulario
        `refresh_token`, como query param `?refresh_token=` o en el cuerpo JSON.
        Funciona tanto para usuarios admin como para clientes B2B.
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: {type: string, example: 9f8e7d6c5b4a3210fedcba9876543210abcdef1234567890abcdef1234567890}
      responses:
        '200':
          description: Nuevo par de tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '401':
          description: Refresh inválido, expirado o identidad no encontrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                invalido: {value: {message: refresh inválido}}
                expirado: {value: {message: refresh expirado}}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: |
        Borra el refresh token asociado a la cookie `mgz_refresh` (best-effort) y
        expira las cookies `mgz_token` y `mgz_refresh`. Sin autenticación.
      operationId: logout
      responses:
        '204':
          description: Sesión cerrada (sin cuerpo).
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/b2b/login:
    post:
      tags: [Autenticación]
      summary: Login del portal B2B
      description: |
        Autentica un cliente SAE habilitado para el portal B2B (`b2b_enabled`,
        con contraseña asignada por el admin). El access token resultante lleva
        rol `b2b` y la lista de precios SAE del cliente, que se aplica en
        `/api/b2b/catalog` y al crear pedidos.
      operationId: b2bLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email, example: vinateria@cliente.mx}
                password: {type: string, minLength: 6, example: clave-del-portal}
      responses:
        '200':
          description: Tokens emitidos con `rol=b2b`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Correo sin acceso B2B habilitado o contraseña incorrecta.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                noHabilitado: {value: {message: acceso B2B no habilitado para este correo}}
                invalidas: {value: {message: credenciales inválidas}}
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/admin/orders:
    get:
      tags: [Admin]
      summary: Listar pedidos
      description: Lista todos los pedidos (B2C y B2B) ordenados del más reciente al más antiguo, con filtros opcionales por estado y tipo. Requiere JWT con rol `admin` o `ventas`.
      operationId: adminListOrders
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          description: Filtra por estado del pedido.
          schema: {$ref: '#/components/schemas/EstadoOrden'}
        - name: tipo
          in: query
          description: Filtra por tipo de pedido.
          schema: {type: string, enum: [b2c, b2b]}
      responses:
        '200':
          description: Lista de pedidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Orden'}}
                  total: {type: integer, example: 42}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
