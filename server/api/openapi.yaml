        '200':
          description: Mapa de segmento → descripción.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
                example:
                  alto_valor: Clientes con más de $25,000 facturados (histórico SAE)
                  sin_compra_90d: Clientes sin compra en los últimos 90 días
                  frecuente: Clientes con 2+ compras al mes en promedio
                  con_saldo: Clientes con saldo pendiente (cobranza)
                  b2b_activo: Clientes con acceso al portal B2B
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/admin/crm/segments/{segmento}/members:
    get:
      tags: [Admin]
      summary: Miembros de un segmento
      description: Clientes que pertenecen al segmento indicado. Requiere JWT con rol `admin` o `ventas`.
      operationId: crmSegmentMembers
      security:
        - bearerAuth: []
      parameters:
        - name: segmento
          in: path
          required: true
          description: ID del segmento.
          schema: {type: string, enum: [alto_valor, sin_compra_90d, frecuente, con_saldo, b2b_activo]}
      responses:
        '200':
          description: Miembros del segmento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segmento: {type: string, example: alto_valor}
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ClienteResumen'}
                  total: {type: integer, example: 6}
        '400':
          description: Segmento inválido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: 'segmento inválido: vip'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/admin/crm/export/{kind}:
    get:
      tags: [Admin]
      summary: Exportar CSV
      description: |
        Descarga un CSV para onboarding de CRM o herramientas externas:
        `customers` (clientes), `orders` (pedidos web) o `deals` (pipeline).
        Requiere JWT con rol `admin` o `ventas`.
      operationId: crmExport
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: path
          required: true
          description: Tipo de exportación.
          schema: {type: string, enum: [customers, orders, deals]}
      responses:
        '200':
          description: 'Archivo CSV (`text/csv; charset=utf-8`) con `Content-Disposition: attachment`.'
          content:
            text/csv:
              schema: {type: string}
              example: |
                id,nombre,rfc,email,telefono,ciudad,lista_precio,saldo,total_facturado,ultima_compra
                00123,Vinatería del Centro,VEC123456ABC,vinateria@cliente.mx,5551234567,CDMX,3,0.00,152430.00,2024-04-18
        '400':
          description: Tipo de exportación inválido.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {message: 'tipo de exportación inválido (customers|orders|deals)'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/b2b/me:
    get:
      tags: [B2B]
      summary: Perfil del cliente autenticado
      description: Devuelve los datos del cliente B2B (sin hash de contraseña) y su lista de precios SAE. Requiere JWT con rol `b2b`.
      operationId: b2bMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cliente y lista de precios.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente: {$ref: '#/components/schemas/Cliente'}
                  lista_precio: {type: integer, example: 3, description: 'Lista SAE asignada (1 = menudeo, 2 = medio mayorista, 3 = vinatería).'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/b2b/catalog:
    get:
      tags: [B2B]
      summary: Catálogo con precios del cliente
      description: |
        Catálogo completo de productos activos con el precio de la lista SAE del
        cliente (`precio_cliente`): lista 2 usa `precio_lista_2`, lista 3 usa
        `precio_lista_3` (con respaldo a precio base/oferta); búsqueda por nombre
        y filtro por categoría. Requiere JWT con rol `b2b`.
      operationId: b2bCatalog
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Búsqueda insensible a mayúsculas por nombre.
          schema: {type: string, example: malbec}
        - name: categoria
          in: query
          description: Filtro exacto de categoría.
          schema: {type: string, example: Vino Tinto}
      responses:
        '200':
          description: Catálogo con precios del cliente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/B2BProducto'}}
                  total: {type: integer, example: 187}
                  lista_precio: {type: integer, example: 3}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/b2b/orders:
    get:
      tags: [B2B]
      summary: Mis pedidos
      description: Pedidos web del cliente autenticado, del más reciente al más antiguo. Requiere JWT con rol `b2b`.
      operationId: b2bOrders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pedidos del cliente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Orden'}}
                  total: {type: integer, example: 5}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [B2B]
      summary: Crear pedido mayorista
      description: |
        Crea un pedido `b2b` con los precios de la lista SAE del cliente.
        Reserva existencia (1 a 500 partidas) y arranca en estado `preparando`:
        los clientes B2B pagan a crédito según sus condiciones SAE, sin referencia
        de transferencia. Requiere JWT con rol `b2b`.
      operationId: b2bCreateOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {$ref: '#/components/schemas/CartItem'}
                direccion: {type: string, example: Bodega Central, Av. de las Industrias 45}
                notas: {type: string, example: Surtido parcial permitido}
      responses:
        '201':
          description: Pedido creado en estado `preparando`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Orden'}
        '400':
          description: JSON inválido, más de 500 partidas, producto no disponible o existencia insuficiente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                partidas: {value: {message: entre 1 y 500 partidas por pedido}}
                agotado: {value: {message: 'existencia insuficiente: Malbec Reserva 2021'}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /webhooks/whatsapp:
    get:
      tags: [Webhooks]
      summary: Verificación del webhook (Meta)
      description: |
        Handshake de verificación de Meta WhatsApp Business API: responde con el
        valor del query param `hub.challenge` cuando `hub.mode=subscribe` y
        `hub.verify_token` coincide con la variable de entorno `WA_VERIFY_TOKEN`.
      operationId: waVerify
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: {type: string, example: subscribe}
        - name: hub.verify_token
          in: query
          required: true
          schema: {type: string, example: mi-verify-token-secreto}
        - name: hub.challenge
          in: query
          required: true
          schema: {type: string, example: '1234567890'}
      responses:
        '200':
          description: Verificación exitosa; cuerpo = valor de `hub.challenge` (texto plano).
          content:
            text/plain:
              schema: {type: string, example: '1234567890'}
        '403':
          description: Token de verificación inválido o modo distinto (sin cuerpo).
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Webhooks]
      summary: Recepción de mensajes de WhatsApp (Meta)
      description: |
        Recibe los payloads de mensajes entrantes de Meta. Por cada mensaje de
        texto ejecuta el chatbot (sesión `wa_<número>`), guarda la conversación y
        reenvía la respuesta vía Graph API cuando `WA_ACCESS_TOKEN` está
        configurado. Meta espera siempre 200, incluso ante payloads no parseables.
      operationId: waReceive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                object: {type: string, example: whatsapp_business_account}
                entry:
                  type: array
                  items:
                    type: object
                    properties:
                      id: {type: string, example: '123456789012345'}
                      changes:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: object
                              properties:
                                messaging_product: {type: string, example: whatsapp}
                                metadata:
                                  type: object
                                  properties:
                                    phone_number_id: {type: string, example: '109876543210'}
                                messages:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      from: {type: string, example: '525512345678'}
                                      id: {type: string, example: wamid.HBgNNTI1MTIzNDU2NzgVAgARGBI5OTk'}
                                      type: {type: string, example: text}
                                      text:
                                        type: object
                                        properties:
                                          body: {type: string, example: 'Hola, ¿tienen Malbec?'}
                                statuses:
                                  type: array
                                  items: {}
      responses:
        '200':
          description: Payload recibido (siempre, incluso con JSON no parseable). Sin cuerpo.
        '400':
          description: Cuerpo ilegible (raro; Meta recibe 200 en la práctica).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT HS256 firmado con `JWT_SECRET`. Claims: `sub` (ID de usuario o
        cliente), `email`, `rol` (`admin` | `ventas` | `b2b`), `lista` (lista de
        precios SAE, solo B2B), `iss=menguz`. Access token 15 min (configurable);
        rota con el refresh token de un solo uso vía `POST /api/auth/refresh`.
  parameters:
    Page:
      name: page
      in: query
      description: Número de página (base 1).
      schema: {type: integer, default: 1, minimum: 1}
    PerPage:
      name: per_page
      in: query
      description: Tamaño de página (1–100; fuera de rango se usa 24).
      schema: {type: integer, default: 24, minimum: 1, maximum: 100}
    CveArt:
      name: cve
      in: path
      required: true
      description: Clave de artículo SAE.
      schema: {type: string, example: VIN-TIN-001}
    OrderId:
      name: id
      in: path
      required: true
      description: ID interno del pedido (`ord_…`).
      schema: {type: string, example: ord_a1b2c3d4e5f6a7b8}
    CampaignId:
      name: id
      in: path
      required: true
      description: ID de la campaña (`camp_…`).
      schema: {type: string, example: camp_a1b2c3d4e5f6a7b8}
    SessionId:
      name: id
      in: path
      required: true
      description: ID de la sesión de chat.
      schema: {type: string, example: chat_a1b2c3d4e5f6a7b8}
  responses:
    BadRequest:
      description: Petición inválida (JSON mal formado, validación o regla de negocio).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: JSON inválido}
    Unauthorized:
      description: 'Falta el header `Authorization: Bearer` o el token es inválido/expirado.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          examples:
            sinToken: {value: {message: token requerido}}
            tokenInvalido: {value: {message: token inválido o expirado}}
    Forbidden:
      description: Token válido pero rol no autorizado para este grupo.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: rol no autorizado}
    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: producto no encontrado}
    TooManyRequests:
      description: Límite de solicitudes excedido (rate limit por IP); reintentar más tarde.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {message: demasiadas solicitudes, intenta más tarde}
  schemas:
    Error:
      type: object
      properties:
        message: {type: string}
    Producto:
      type: object
      description: Producto sincronizado desde Aspel SAE 8.0 (INVE01 + INVE_CLIB01).
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        nombre: {type: string, example: Malbec Reserva 2021}
        descripcion: {type: string, example: Malbec de Valle de Guadalupe, 12 meses en roble.}
        precio_base: {type: number, example: 489.0, description: Precio lista 1 (menudeo).}
        precio_lista_2: {type: number, example: 439.0, description: Precio medio mayorista.}
        precio_lista_3: {type: number, example: 399.0, description: Precio vinatería / B2B.}
        precio_oferta: {type: number, example: 429.0, description: Override de precio desde campaña (omite si es 0).}
        existencia: {type: number, example: 12.0}
        unidad_medida: {type: string, example: PZA}
        linea: {type: string, example: VINOS}
        categoria: {type: string, example: Vino Tinto, description: Categoría de la tienda.}
        grupo: {type: string, example: Vinos, description: Grupo de la tienda (Vinos, Licores…).}
        graduacion: {type: string, example: 13.5%}
        origen: {type: string, example: México}
        notas_cata: {type: string, example: 'Color rubí intenso; nariz a frutos rojos y vainilla.'}
        imagen_url: {type: string, example: /products/malbec-reserva.png}
        activo: {type: boolean, example: true}
        ultima_sync: {type: string, format: date-time}
    ProductoPublicoLite:
      type: object
      description: Formato compacto para la sección Especiales del storefront (claves cortas).
      properties:
        n: {type: string, example: Malbec Reserva 2021}
        p: {type: number, example: 489.0}
        c: {type: string, example: Vino Tinto}
        g: {type: string, example: Vinos}
        i: {type: string, example: products/malbec-reserva.png, description: Ruta de imagen sin `/` inicial.}
    Categoria:
      type: object
      properties:
        nombre: {type: string, example: Vino Tinto}
        grupo: {type: string, example: Vinos}
        total: {type: integer, example: 42}
    Campana:
      type: object
      description: Campaña promocional administrable; se publica sola en el storefront durante su vigencia.
      properties:
        id: {type: string, example: camp_a1b2c3d4e5f6a7b8}
        titulo: {type: string, example: Semana del Malbec}
        tipo: {type: string, enum: [carousel, producto_mes, especial], example: carousel}
        imagen_url: {type: string, example: /img/promos/semana-malbec.jpg}
        descripcion: {type: string, example: 15% de descuento en tintos seleccionados.}
        cve_art: {type: string, example: VIN-TIN-001, description: Producto ligado (opcional).}
        precio_oferta: {type: number, example: 429.0}
        cta_texto: {type: string, example: Cotiza ahora}
        cta_url: {type: string, example: /promociones}
        wa_mensaje: {type: string, example: Hola, me interesa la promo Semana del Malbec}
        inicio: {type: string, format: date-time, example: '2024-05-01T00:00:00Z'}
        fin: {type: string, format: date-time, example: '2024-05-31T23:59:59Z'}
        activa: {type: boolean, example: true}
        orden: {type: integer, example: 10}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CampanaInput:
      type: object
      description: Cuerpo para crear/actualizar campaña (fechas como RFC3339 o YYYY-MM-DD).
      required: [titulo, tipo, inicio, fin]
      properties:
        titulo: {type: string, minLength: 3, example: Semana del Malbec}
        tipo: {type: string, enum: [carousel, producto_mes, especial], example: carousel}
        imagen_url: {type: string, example: /img/promos/semana-malbec.jpg}
        descripcion: {type: string, example: 15% de descuento en tintos seleccionados.}
        cve_art: {type: string, example: VIN-TIN-001}
        precio_oferta: {type: number, example: 429.0}
        cta_texto: {type: string, example: Cotiza ahora}
        cta_url: {type: string, example: /promociones}
        wa_mensaje: {type: string, example: Hola, me interesa la promo}
        inicio: {type: string, example: '2024-05-01', description: RFC3339 o YYYY-MM-DD.}
        fin: {type: string, example: '2024-05-31', description: RFC3339 o YYYY-MM-DD (debe ser posterior a inicio).}
        activa: {type: boolean, example: true}
        orden: {type: integer, example: 10}
    PerfilVino:
      type: object
      description: Ficha curada de sommelier (capa editorial sobre el producto SAE); se conserva entre syncs.
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        tipo: {type: string, example: Tinto, enum: [Tinto, Blanco, Rosado, Espumoso, Champagne, Licor, Otro]}
        uvas: {type: array, items: {type: string}, example: [Malbec, Cabernet Sauvignon]}
        bodega: {type: string, example: Viñedos del Valle}
        region: {type: string, example: Valle de Guadalupe}
        pais: {type: string, example: México}
        anada: {type: string, example: '2021', description: Añada; vacío = sin añada (NV).}
        graduacion: {type: string, example: 13.5%}
        crianza: {type: string, example: Roble 6 meses}
        notas_cata: {type: string, example: 'Color rubí; nariz a frutos rojos; boca tánica elegante.'}
        maridaje: {type: string, example: Carnes rojas a la parrilla, quesos añejos}
        descripcion: {type: string, example: Descripción editorial larga del vino.}
        ocasiones: {type: array, items: {type: string}, example: [asado, regalo, celebración]}
        tags: {type: array, items: {type: string}, example: [frutal, tánico, añejo]}
        updated_at: {type: string, format: date-time}
    FichaVino:
      type: object
      description: Ficha pública completa (identidad + precio efectivo + existencia + perfil curado).
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        nombre: {type: string, example: Malbec Reserva 2021}
        categoria: {type: string, example: Vino Tinto}
        tipo: {type: string, example: Tinto}
        precio: {type: number, example: 489.0, description: Precio efectivo (oferta aplicada si aplica).}
        existencia: {type: number, example: 12.0}
        imagen: {type: string, example: products/malbec-reserva.png}
        descripcion: {type: string, example: Descripción editorial o la del catálogo SAE.}
        bodega: {type: string, example: Viñedos del Valle}
        uvas: {type: array, items: {type: string}, example: [Malbec]}
        region: {type: string, example: Valle de Guadalupe}
        pais: {type: string, example: México}
        anada: {type: string, example: '2021', description: '`sin añada (NV)` cuando no aplica.'}
        graduacion: {type: string, example: 13.5%}
        crianza: {type: string, example: Roble 6 meses}
        notas_cata: {type: string, example: 'Color rubí; nariz a frutos rojos.'}
        maridaje: {type: string, example: Carnes rojas a la parrilla}
        ocasiones: {type: array, items: {type: string}, example: [asado]}
        tags: {type: array, items: {type: string}, example: [frutal, tánico]}
    CartItem:
      type: object
      required: [cve_art, cantidad]
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        cantidad: {type: number, example: 2}
    CartLine:
      type: object
      description: Partida del carrito enriquecida con datos en vivo.
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        cantidad: {type: number, example: 2}
        nombre: {type: string, example: Malbec Reserva 2021}
        precio: {type: number, example: 489.0, description: Precio efectivo unitario.}
        disponible: {type: number, example: 12.0, description: Existencia actual del producto.}
        importe: {type: number, example: 978.0, description: precio × cantidad.}
    OrderItem:
      type: object
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        nombre: {type: string, example: Malbec Reserva 2021}
        cantidad: {type: number, example: 2}
        precio: {type: number, example: 489.0, description: Precio unitario al momento de la compra.}
    EstadoOrden:
      type: string
      enum: [pendiente_pago, pagado, preparando, enviado, entregado, cancelado]
      example: pendiente_pago
    Orden:
      type: object
      properties:
        id: {type: string, example: ord_a1b2c3d4e5f6a7b8}
        folio: {type: string, example: MGZ-000042, description: Folio amigable para el cliente.}
        tipo: {type: string, enum: [b2c, b2b], example: b2c}
        cliente_id: {type: string, example: '00123', description: Solo pedidos B2B o de cliente registrado.}
        cliente_nombre: {type: string, example: María Fernanda López}
        cliente_email: {type: string, example: maria@example.com}
        cliente_telefono: {type: string, example: '5512345678'}
        direccion: {type: string, example: Av. Reforma 123, CDMX}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        subtotal: {type: number, example: 1458.0}
        envio: {type: number, example: 150.0}
        total: {type: number, example: 1608.0}
        estado: {$ref: '#/components/schemas/EstadoOrden'}
        referencia_pago: {type: string, example: MENG000042, description: Referencia de transferencia bancaria.}
        pago_metodo: {type: string, example: transferencia}
        notas: {type: string, example: Entregar después de las 6 pm}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PagoTransferencia:
      type: object
      description: Datos bancarios para completar el pago del pedido B2C.
      properties:
        metodo: {type: string, example: transferencia}
        referencia: {type: string, example: MENG000042, description: Referencia única a indicar en la transferencia.}
        banco: {type: string, example: BBVA, description: De la variable BANK_NAME.}
        clabe: {type: string, example: '000000000000000000', description: De la variable BANK_CLABE.}
        titular: {type: string, example: Menguz Vinos y Licores SA de CV, description: De la variable BANK_HOLDER.}
        monto: {type: number, example: 1608.0}
        instrucciones: {type: string, example: Realiza la transferencia e indica la referencia. Confirmaremos tu pedido en cuánto se refleje el pago.}
    Cliente:
      type: object
      description: Cliente sincronizado desde CLIE01 de SAE; `b2b_pass_hash` nunca se expone en respuestas.
      properties:
        id: {type: string, example: '00123', description: Clave SAE (trimmed).}
        nombre: {type: string, example: Vinatería del Centro}
        rfc: {type: string, example: VEC123456ABC}
        email: {type: string, example: vinateria@cliente.mx}
        telefono: {type: string, example: '5551234567'}
        calle: {type: string, example: Av. Juárez 45}
        colonia: {type: string, example: Centro}
        ciudad: {type: string, example: CDMX}
        estado: {type: string, example: Ciudad de México}
        cp: {type: string, example: '06000'}
        lista_precio: {type: integer, example: 3, description: Lista SAE 1–10.}
        limite_credito: {type: number, example: 50000.0}
        saldo: {type: number, example: 12000.0}
        b2b_enabled: {type: boolean, example: true, description: Acceso al portal B2B habilitado por el admin.}
        ultima_sync: {type: string, format: date-time}
    ClienteResumen:
      type: object
      description: Cliente con métricas agregadas (lista CRM y miembros de segmento).
      properties:
        cliente: {$ref: '#/components/schemas/Cliente'}
        total_facturado: {type: number, example: 152430.0}
        ultima_compra: {type: string, format: date-time, nullable: true, example: '2024-04-18T12:00:00Z'}
        frecuencia_mes: {type: integer, example: 2, description: Compras promedio por mes.}
        web_orders: {type: integer, example: 3, description: Número de pedidos web (en miembros de segmento se omite y se incluye `segmentos`).}
        segmentos: {type: array, items: {type: string}, example: [alto_valor, frecuente]}
    Factura:
      type: object
      description: Factura sincronizada desde SAE (FACT01/FACTD01); en la vista 360 se omiten los detalles.
      properties:
        id: {type: string, example: FAC-000987}
        cliente_id: {type: string, example: '00123'}
        fecha: {type: string, format: date-time}
        total: {type: number, example: 12500.0}
        detalles: {type: array, items: {$ref: '#/components/schemas/FacturaDetalle'}}
    FacturaDetalle:
      type: object
      properties:
        cve_art: {type: string, example: VIN-TIN-001}
        cant: {type: number, example: 12.0}
        precio: {type: number, example: 399.0}
    Customer360:
      type: object
      description: Vista unificada del cliente para el CRM (SAE + pedidos web).
      properties:
        cliente: {$ref: '#/components/schemas/Cliente'}
        total_facturado: {type: number, example: 152430.0}
        ultima_compra: {type: string, format: date-time, nullable: true}
        web_orders: {type: array, items: {$ref: '#/components/schemas/Orden'}}
        facturas: {type: array, items: {$ref: '#/components/schemas/Factura'}}
        frecuencia_mes: {type: integer, example: 2}
        segmentos: {type: array, items: {type: string}, example: [alto_valor, frecuente, b2b_activo]}
    Deal:
      type: object
      properties:
        id: {type: string, example: deal_a1b2c3d4e5f6a7b8}
        cliente_id: {type: string, example: '00123'}
        titulo: {type: string, example: Renovación anual vinatería Centro}
        monto: {type: number, example: 85000.0}
        etapa: {type: string, enum: [nuevo, contactado, propuesta, ganado, perdido], example: propuesta}
        notas: {type: string, example: Prefiere entregas los jueves.}
        origen: {type: string, enum: [web, whatsapp, telefono, b2b], example: whatsapp}
        asignado_a: {type: string, example: admin@menguz.local}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DealInput:
      type: object
      required: [titulo, etapa]
      properties:
        cliente_id: {type: string, example: '00123'}
        titulo: {type: string, minLength: 3, example: Renovación anual vinatería Centro}
        monto: {type: number, example: 85000.0}
        etapa: {type: string, enum: [nuevo, contactado, propuesta, ganado, perdido], example: nuevo}
        notas: {type: string, example: Prefiere entregas los jueves.}
        origen: {type: string, enum: [web, whatsapp, telefono, b2b], example: web}
    ChatMessage:
      type: object
      properties:
        role: {type: string, enum: [user, assistant, system], example: user}
        content: {type: string, example: '¿Tienen Malbec?'}
        created_at: {type: string, format: date-time}
    ChatSession:
      type: object
      properties:
        id: {type: string, example: chat_a1b2c3d4e5f6a7b8}
        canal: {type: string, enum: [web, whatsapp, sommelier], example: web}
        cliente_tel: {type: string, example: '525512345678', description: Solo sesiones de WhatsApp.}
        escalado: {type: boolean, example: false, description: Requiere atención humana.}
        messages: {type: array, items: {$ref: '#/components/schemas/ChatMessage'}}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SyncLog:
      type: object
      description: Entrada de la bitácora de sincronización SAE.
      properties:
        id: {type: string, example: sync_a1b2c3d4e5f6a7b8}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        productos: {type: integer, example: 187}
        clientes: {type: integer, example: 58}
        facturas: {type: integer, example: 1234}
        origen: {type: string, enum: [firebird, mock], example: mock}
        error: {type: string, description: Vacío cuando la sync terminó bien.}
    TokenResponse:
      type: object
      description: Par de tokens emitido en login y refresh; `rol` indica el ámbito del token.
      properties:
        access_token: {type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…}
        refresh_token: {type: string, example: 9f8e7d6c5b4a3210fedcba9876543210abcdef1234567890abcdef1234567890}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 900, description: Segundos de vida del access token (15 min por defecto).}
        rol: {type: string, enum: [admin, ventas, b2b], example: admin}
    B2BProducto:
      type: object
      description: Producto con `precio_cliente` calculado según la lista SAE del cliente B2B.
      allOf:
        - $ref: '#/components/schemas/Producto'
        - type: object
          properties:
            precio_cliente: {type: number, example: 399.0}
